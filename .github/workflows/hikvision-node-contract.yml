name: Hikvision node contract

on:
  push:
    branches: [main, 'agent/**']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare and validate Hikvision settings persistence
        run: |
          python3 -m py_compile scripts/patch-hikvision-device-settings.py
          python3 scripts/patch-hikvision-device-settings.py --project-dir .
          before_devices="$(sha256sum frontend/src/views/DevicesView.vue | awk '{print $1}')"
          before_dashboard="$(sha256sum backend/src/routes/dashboard.ts | awk '{print $1}')"
          python3 scripts/patch-hikvision-device-settings.py --project-dir .
          test "$before_devices" = "$(sha256sum frontend/src/views/DevicesView.vue | awk '{print $1}')"
          test "$before_dashboard" = "$(sha256sum backend/src/routes/dashboard.ts | awk '{print $1}')"
          grep -q "editingDevice && value === editingDevice.connection_type" frontend/src/views/DevicesView.vue
          grep -q "connection_type === 'HIKVISION'" backend/src/routes/dashboard.ts
      - name: Prepare and validate Hikvision HLS proxy
        run: |
          python3 -m py_compile scripts/patch-hikvision-hls-proxy.py
          python3 scripts/patch-hikvision-hls-proxy.py --project-dir .
          before="$(sha256sum backend/src/routes/hikvisionPlayer.ts | awk '{print $1}')"
          python3 scripts/patch-hikvision-hls-proxy.py --project-dir .
          after="$(sha256sum backend/src/routes/hikvisionPlayer.ts | awk '{print $1}')"
          test "$before" = "$after"
          grep -q "rewriteHlsPlaylistBrowserToken" backend/src/routes/hikvisionPlayer.ts
          grep -q "x-newdomofon-hikvision-playlist-token" backend/src/routes/hikvisionPlayer.ts
          grep -q "await sendProxyHlsPlaylist(upstream, res, browserToken)" backend/src/routes/hikvisionPlayer.ts
      - name: Prepare and validate Hikvision response performance
        run: |
          python3 -m py_compile scripts/patch-hikvision-performance.py
          python3 scripts/patch-hikvision-performance.py --project-dir .
          before="$(sha256sum backend/src/routes/hikvisionPlayer.ts frontend/src/views/HikvisionPlayerView.vue | sha256sum | awk '{print $1}')"
          python3 scripts/patch-hikvision-performance.py --project-dir .
          after="$(sha256sum backend/src/routes/hikvisionPlayer.ts frontend/src/views/HikvisionPlayerView.vue | sha256sum | awk '{print $1}')"
          test "$before" = "$after"
          grep -q "ARCHIVE_RANGE_CONCURRENCY = 2" backend/src/routes/hikvisionPlayer.ts
          grep -q "loadArchiveRangesCached" backend/src/routes/hikvisionPlayer.ts
          grep -q "Live must not wait" frontend/src/views/HikvisionPlayerView.vue
          grep -q "rangesPromise" frontend/src/views/HikvisionPlayerView.vue
      - name: Validate contract files
        run: |
          test -s backend/migrations/094_hikvision_node_contract.sql
          test -s docs/HIKVISION_NODE_REGISTRATION.md
          grep -q "HIKVISION" backend/src/routes/devices.ts
          grep -q "hikvision/sync" backend/src/routes/nodeAgent.ts
          grep -q "node_kind" backend/src/routes/dvrServers.ts
          grep -q "Hikvision node" frontend/src/views/NodesView.vue
          grep -q "Каналы синхронизируются автоматически" frontend/src/views/DevicesView.vue
          grep -q "hikvisionMediaProxyRouter" backend/src/routes/hikvisionPlayer.ts
          grep -q "/api/hikvision-media" backend/src/routes/hikvisionPlayer.ts
          grep -q "master-https-proxy" backend/src/routes/hikvisionPlayer.ts
          grep -q "agent_token_hash AS node_agent_token_hash" backend/src/routes/hikvisionPlayer.ts
          grep -q "upstream_media_auth: 'agent-token-hash'" backend/src/routes/hikvisionPlayer.ts
          grep -q "ARCHIVE_RANGE_CHUNK_MS" backend/src/routes/hikvisionPlayer.ts
          grep -Eq 'location[[:space:]]+\^~[[:space:]]+/api/' deploy/nginx/newdomofon-video.conf
          grep -q 'timeout: 120_000' frontend/src/api.ts
          ! grep -q "directMediaUrl" backend/src/routes/hikvisionPlayer.ts
          ! grep -q "absoluteNodeUrl" backend/src/routes/hikvisionPlayer.ts
          ! grep -RIn "fetch(.*ISAPI\|/ISAPI/" backend/src --include='*.ts'
      - name: Validate preserved Nginx normalization
        run: |
          tmp="$(mktemp)"
          cp deploy/nginx/newdomofon-video.conf "$tmp"
          python3 scripts/normalize-smartyard-media-cors.py "$tmp"
          grep -Eq 'location[[:space:]]+\^~[[:space:]]+/api/' "$tmp"
          before="$(sha256sum "$tmp" | awk '{print $1}')"
          python3 scripts/normalize-smartyard-media-cors.py "$tmp"
          after="$(sha256sum "$tmp" | awk '{print $1}')"
          test "$before" = "$after"
      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npx tsx test/hikvisionHls.test.ts
          npm run build
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
