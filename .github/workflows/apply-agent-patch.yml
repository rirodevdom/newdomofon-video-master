name: Apply Hikvision node integration

on:
  push:
    branches: ['agent/hikvision-node-integration']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hikvision-node-integration
          fetch-depth: 0
      - name: Apply implementation
        run: |
          base64 -d .github/agent.patch.gz.b64 | gzip -dc > /tmp/agent.patch
          git apply --index /tmp/agent.patch
          git rm .github/agent.patch.gz.b64 .github/workflows/apply-agent-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Integrate manually paired Hikvision nodes"
          git push origin HEAD:agent/hikvision-node-integration
