name: Apply Hikvision node integration

on:
  push:
    branches: ['agent/hikvision-node-integration']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hikvision-node-integration
          fetch-depth: 0
      - name: Apply implementation
        run: |
          files=(
            .github/patch-parts/00
            .github/patch-parts/01
            .github/patch-parts/02a0
            .github/patch-parts/02a10
            .github/patch-parts/02a11
            .github/patch-parts/02b
            .github/patch-parts/03
            .github/patch-parts/04
          )

          for file in "${files[@]}"; do
            test -f "$file"
            printf '%s ' "$file"
            tr -cd 'A-Za-z0-9+/=' < "$file" | sha256sum
          done

          cat "${files[@]}" | tr -cd 'A-Za-z0-9+/=' > /tmp/agent.patch.gz.b64
          echo '80c9e29b7b1473cb08daed5c0cc37dc1eab2ed051049b9bb526cadded4500b3e  /tmp/agent.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/agent.patch.gz.b64 | gzip -dc > /tmp/agent.patch
          git apply --index /tmp/agent.patch
          git rm -r .github/patch-parts
          git rm -f .github/agent.patch.gz.b64 || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Integrate manually paired Hikvision nodes"
          git push origin HEAD:agent/hikvision-node-integration
