name: Apply Hikvision node integration

on:
  push:
    branches: ['agent/hikvision-node-integration']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hikvision-node-integration
          fetch-depth: 0
      - name: Apply implementation
        run: |
          # All patch parts are now committed on the same branch head.
          if ! compgen -G '.github/patch-parts/*' >/dev/null; then
            echo 'No staged patch parts; nothing to apply.'
            exit 0
          fi

          cat .github/patch-parts/* | tr -d '\n\r' | base64 -d | gzip -dc > /tmp/agent.patch
          git apply --index /tmp/agent.patch
          git rm -r .github/patch-parts
          git rm -f .github/agent.patch.gz.b64 || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Integrate manually paired Hikvision nodes"
          git push origin HEAD:agent/hikvision-node-integration
