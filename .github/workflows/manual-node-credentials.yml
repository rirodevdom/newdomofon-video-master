name: Master node-only validation

on:
  pull_request:
  push:
    branches:
      - main
      - refactor/remove-hikvision-isapi

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: newdomofon
          POSTGRES_PASSWORD: ci_database_password
          POSTGRES_DB: newdomofon_video
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U newdomofon -d newdomofon_video"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      NODE_ENV: production
      BACKEND_PORT: 3000
      DATABASE_URL: postgres://newdomofon:ci_database_password@127.0.0.1:5432/newdomofon_video
      JWT_SECRET: ci_jwt_secret_value_with_more_than_thirty_two_characters
      MANAGED_CAMERA_TOKEN_SECRET: ci_managed_camera_token_secret_with_more_than_thirty_two_chars
      ADMIN_LOGIN: admin
      ADMIN_PASSWORD: ci_admin_password_2026
      CORS_ORIGIN: http://127.0.0.1
      TRUST_PROXY: 'true'
      APP_PUBLIC_URL: http://127.0.0.1
      SMARTYARD_PUBLIC_BASE_URL: http://127.0.0.1
      INTERNAL_DVR_SECRET: ci_internal_dvr_secret_with_more_than_thirty_two_chars
      NODE_REGISTRATION_TOKEN: ''

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Validate shell and Python helpers
        run: |
          bash -n scripts/install-manual-node-credentials.sh
          bash -n scripts/install-master-manual-local-root.sh
          bash -n scripts/apply-managed-token-rollout.sh
          bash -n scripts/install-manual-auto-managed-tokens.sh
          bash -n scripts/deploy-master-with-manual-auto-tokens.sh
          python3 -m py_compile \
            scripts/remove-hikvision-runtime.py \
            scripts/fix-manual-token-resolver-variable.py \
            scripts/patch-archive-playback-window.py \
            scripts/patch-archive-seek-navigation.py \
            scripts/patch-managed-media-gateway.py \
            scripts/patch-manual-auto-managed-tokens.py \
            scripts/patch-system-managed-token-ui.py

      - name: Validate Hikvision boundary
        run: |
          test ! -e backend/src/services/hikvisionChannels.ts
          test ! -e scripts/patch-device-owned-archive-storage.py
          ! grep -R -n -E 'ISAPI|alertStream|/devices/hikvision|device-archive|device_archive_segments' \
            backend/src frontend/src scripts \
            --exclude='remove-hikvision-runtime.py'
          ! grep -R -n -E "connection_type.*HIKVISION|DVR_HIKVISION_|DVR_DEVICE_ARCHIVE_" \
            backend/src frontend/src deploy scripts \
            --exclude='remove-hikvision-runtime.py'
          grep -q "CHECK (connection_type IN ('RTSP', 'ONVIF'))" backend/migrations/093_remove_hikvision_isapi.sql
          grep -q "DROP TABLE IF EXISTS public.device_archive_segments" backend/migrations/093_remove_hikvision_isapi.sql
          grep -q "source: 'node'" frontend/src/views/PlayerView.vue
          python3 scripts/patch-archive-seek-navigation.py --project-dir .

      - name: Build and migrate backend
        working-directory: backend
        run: |
          npm ci --include=dev
          npm run build
          npm run migrate
          npm run migrate
          npm run seed

      - name: Verify database migration
        working-directory: backend
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
          const deviceArchive = await pool.query(`
            SELECT to_regclass('public.device_archive_segments') AS segments,
                   to_regclass('public.device_archive_sync_state') AS sync_state
          `);
          if (deviceArchive.rows[0].segments || deviceArchive.rows[0].sync_state) {
            throw new Error('ISAPI archive index tables still exist');
          }
          const checks = await pool.query(`
            SELECT pg_get_constraintdef(oid) AS definition
              FROM pg_constraint
             WHERE conrelid = 'public.devices'::regclass
               AND conname = 'devices_connection_type_check'
          `);
          if (checks.rowCount !== 1 || /HIKVISION/i.test(checks.rows[0].definition)) {
            throw new Error('Hikvision device type is still accepted');
          }
          await pool.end();
          NODE

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --include=dev
          npm run build
